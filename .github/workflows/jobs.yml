# Scheduled backend jobs, run by GitHub Actions so nothing has to stay running on your own computer.
# They connect straight to the hosted database and Redis using the repository secrets below
# (Settings > Secrets and variables > Actions):
#   DATABASE_URL, REDIS_URL, CONGRESS_API_KEY, OPENAI_API_KEY, and for recap emails BREVO_API_KEY,
#   EMAIL_FROM, WEB_URL and API_URL. Step-by-step setup: DEPLOY.md.
# Free for public repositories; private ones get a monthly allowance of minutes (about 3 minutes a run here).
# Every job can also be started by hand from the Actions tab ("Run workflow").

name: Scheduled jobs

on:
  schedule:
    - cron: "0 6,12,18,23 * * *"  # ingest new and updated bills, and recorded votes, 4 times a day
    - cron: "15 4 * * *"          # nightly cleanup
    - cron: "0 14 * * 6"          # weekly recap emails, Saturday 9am Eastern / 8am Central
    - cron: "0 14 * * 0"          # Sunday: finish any recap emails past the free plan's daily cap
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run (python -m app.cli <command>)"
        required: true
        default: ingest
        type: choice
        options: [ingest, sync-votes, trending, prune, send-recaps, metrics, migrate]

concurrency:
  group: scheduled-jobs  # one job at a time, so two ingests never overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      WEB_URL: ${{ secrets.WEB_URL }}
      API_URL: ${{ secrets.API_URL }}
      SERVERLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pick the command
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 6,12,18,23 * * *") echo "cmd=ingest" >> "$GITHUB_OUTPUT" ;;
            "15 4 * * *") echo "cmd=prune" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * 6"|"0 14 * * 0") echo "cmd=send-recaps" >> "$GITHUB_OUTPUT" ;;
            *) echo "cmd=${{ inputs.command }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run it
        run: |
          if [ "${{ steps.pick.outputs.cmd }}" = "migrate" ]; then
            alembic upgrade head
          else
            python -m app.cli "${{ steps.pick.outputs.cmd }}"
          fi
